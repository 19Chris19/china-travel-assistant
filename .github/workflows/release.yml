name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel "setuptools>=77" ruff
          python -m pip install -e plugins/china-travel-assistant
      - name: Verify tag and package versions
        run: |
          export RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          root = Path.cwd()
          expected = os.environ["RELEASE_VERSION"]
          manifest = json.loads(
              (root / "plugins/china-travel-assistant/.codex-plugin/plugin.json").read_text(encoding="utf-8")
          )
          pyproject = tomllib.loads(
              (root / "plugins/china-travel-assistant/pyproject.toml").read_text(encoding="utf-8")
          )
          init_text = (root / "plugins/china-travel-assistant/src/china_travel_assistant/__init__.py").read_text(
              encoding="utf-8"
          )
          assert manifest["version"] == expected
          assert pyproject["project"]["version"] == expected
          assert f'__version__ = "{expected}"' in init_text
          PY
      - name: Run release gates
        run: |
          python scripts/validate-plugin.py
          python -m unittest discover -s tests -v
          python -m compileall -q plugins/china-travel-assistant/src
          ruff check --isolated --select E4,E7,E9,F plugins/china-travel-assistant/src plugins/china-travel-assistant/skills/plan-china-trip/scripts tests
      - name: Build release assets
        run: |
          python scripts/build-release.py --version "${GITHUB_REF_NAME#v}" --output dist
          sha256sum -c dist/SHA256SUMS
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
            if [ ! -f "$notes_file" ]; then
              notes_file="CHANGELOG.md"
            fi
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "远行计划局 · 中国出行 Agent Skill ${GITHUB_REF_NAME}" \
              --notes-file "$notes_file"
          fi
