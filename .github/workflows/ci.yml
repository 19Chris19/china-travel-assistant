name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e plugins/china-travel-assistant
      - run: python -m pip install ruff
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q plugins/china-travel-assistant/src
      - run: ruff check --isolated --select E4,E7,E9,F plugins/china-travel-assistant/src plugins/china-travel-assistant/skills/plan-china-trip/scripts tests
      - run: python -m pip wheel --no-deps --wheel-dir dist plugins/china-travel-assistant

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build wheel "setuptools>=77"
      - run: python scripts/validate-plugin.py
      - run: python scripts/build-release.py --version 0.3.0 --output dist
      - run: sha256sum -c SHA256SUMS
        working-directory: dist

  credential-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/china-travel-assistant/credential-ui/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: plugins/china-travel-assistant/credential-ui
      - run: npm run check
        working-directory: plugins/china-travel-assistant/credential-ui
      - run: npm test
        working-directory: plugins/china-travel-assistant/credential-ui

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
