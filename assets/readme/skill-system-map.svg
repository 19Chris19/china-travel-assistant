<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">中国出行助手 Skill 系统图</title>
  <desc id="desc">自然语言需求进入 plan-china-trip，由它路由到航班、火车、接驳、酒店和网页核验五个执行 Skill。</desc>
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F43F5E"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#38BDF8"/></marker>
  </defs>
  <rect width="1200" height="600" rx="8" fill="#0B0F17"/>
  <text x="42" y="54" fill="#F8FAFC" font-size="36" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">一句需求，路由到五个执行 Skill</text>
  <text x="42" y="88" fill="#94A3B8" font-size="24" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">INTENT → ORCHESTRATOR → SPECIALISTS → EVIDENCE</text>

  <path d="M254 300H334" stroke="#F43F5E" stroke-width="5" marker-end="url(#arrow-red)"/>
  <path d="M652 300H708V102H752M708 102V498M708 202H752M708 300H752M708 398H752M708 498H752" fill="none" stroke="#334155" stroke-width="4"/>
  <path d="M708 102H752M708 202H752M708 300H752M708 398H752" stroke="#F43F5E" stroke-width="4" marker-end="url(#arrow-red)"/>
  <path d="M708 498H752" stroke="#38BDF8" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow-blue)"/>

  <rect x="40" y="240" width="214" height="120" rx="6" fill="#111827" stroke="#334155" stroke-width="2"/>
  <circle cx="76" cy="278" r="12" fill="#34D399"/>
  <text x="102" y="286" fill="#94A3B8" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">USER INPUT</text>
  <text x="68" y="330" fill="#F8FAFC" font-size="30" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">自然语言需求</text>

  <rect x="338" y="202" width="314" height="196" rx="8" fill="#181826" stroke="#F43F5E" stroke-width="3"/>
  <rect x="364" y="224" width="174" height="38" rx="4" fill="#F43F5E"/>
  <text x="451" y="250" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ORCHESTRATOR</text>
  <text x="364" y="318" fill="#F8FAFC" font-size="34" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">$plan-china-trip</text>
  <text x="364" y="360" fill="#94A3B8" font-size="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">解析偏好 · 合并证据 · 比较总价</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="758" y="62" width="400" height="80" rx="6" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="782" y="98" fill="#F8FAFC" font-size="27" font-weight="700">$search-china-flights</text>
    <text x="782" y="126" fill="#94A3B8" font-size="20">FlyAI · VARIFLIGHT</text>
    <circle cx="1124" cy="102" r="10" fill="#F43F5E"/>

    <rect x="758" y="162" width="400" height="80" rx="6" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="782" y="198" fill="#F8FAFC" font-size="27" font-weight="700">$search-china-trains</text>
    <text x="782" y="226" fill="#94A3B8" font-size="20">12306 MCP</text>
    <circle cx="1124" cy="202" r="10" fill="#F43F5E"/>

    <rect x="758" y="260" width="400" height="80" rx="6" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="782" y="296" fill="#F8FAFC" font-size="27" font-weight="700">$plan-china-transfers</text>
    <text x="782" y="324" fill="#94A3B8" font-size="20">AMAP LBS</text>
    <circle cx="1124" cy="300" r="10" fill="#38BDF8"/>

    <rect x="758" y="358" width="400" height="80" rx="6" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="782" y="394" fill="#F8FAFC" font-size="27" font-weight="700">$search-china-hotels</text>
    <text x="782" y="422" fill="#94A3B8" font-size="20">FlyAI · FLIGGY</text>
