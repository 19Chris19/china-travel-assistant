    <rect x="758" y="458" width="400" height="80" rx="6" fill="#111827" stroke="#38BDF8" stroke-width="2" stroke-dasharray="9 7"/>
    <text x="782" y="494" fill="#F8FAFC" font-size="27" font-weight="700">$verify-travel-web</text>
    <text x="782" y="522" fill="#94A3B8" font-size="20">EGO BROWSER · ON DEMAND</text>
    <circle cx="1124" cy="498" r="10" fill="#38BDF8"/>
  </g>
  <text x="42" y="562" fill="#94A3B8" font-size="24" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PRIMARY QUERY ───  CONDITIONAL WEB VERIFY - - -</text>
