<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">远行计划局八 Skill 系统图</title>
  <desc id="desc">自然语言需求进入 plan-china-trip，由父 Skill 编排航班、火车、接驳、酒店、网页核验、路线推演和精确展示七个专业 Skill。</desc>
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F43F5E"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#38BDF8"/></marker>
  </defs>
  <rect width="1200" height="760" rx="8" fill="#0B0F17"/>
  <text x="42" y="54" fill="#F8FAFC" font-size="36" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">一个 Agent，编排八个可独立调用的 Skill</text>
  <text x="42" y="88" fill="#94A3B8" font-size="24" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">INTENT → ORCHESTRATOR → PROVIDERS → OMNIROUTE → PRESENTATION</text>

  <path d="M254 384H334" stroke="#F43F5E" stroke-width="5" marker-end="url(#arrow-red)"/>
  <path d="M652 384H708V130H752M708 130V634" fill="none" stroke="#334155" stroke-width="4"/>
  <path d="M708 130H752M708 214H752M708 298H752M708 382H752M708 466H752" stroke="#F43F5E" stroke-width="4" marker-end="url(#arrow-red)"/>
  <path d="M708 550H752M708 634H752" stroke="#38BDF8" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow-blue)"/>

  <rect x="40" y="324" width="214" height="120" rx="6" fill="#111827" stroke="#334155" stroke-width="2"/>
  <circle cx="76" cy="362" r="12" fill="#34D399"/>
  <text x="102" y="370" fill="#94A3B8" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">USER INPUT</text>
  <text x="68" y="414" fill="#F8FAFC" font-size="30" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">自然语言需求</text>

  <rect x="338" y="286" width="314" height="196" rx="8" fill="#181826" stroke="#F43F5E" stroke-width="3"/>
  <rect x="364" y="308" width="174" height="38" rx="4" fill="#F43F5E"/>
  <text x="451" y="334" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ORCHESTRATOR</text>
  <text x="364" y="402" fill="#F8FAFC" font-size="29" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">$plan-china-trip</text>
  <text x="364" y="444" fill="#94A3B8" font-size="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">智能选择偏拓界 · 证据合并 · 硬约束</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="758" y="94" width="400" height="72" rx="6" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="782" y="125" fill="#F8FAFC" font-size="25" font-weight="700">$search-china-flights</text><text x="782" y="151" fill="#94A3B8" font-size="18">FLYAI · VARIFLIGHT</text><circle cx="1124" cy="130" r="9" fill="#F43F5E"/>

    <rect x="758" y="178" width="400" height="72" rx="6" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="782" y="209" fill="#F8FAFC" font-size="25" font-weight="700">$search-china-trains</text><text x="782" y="235" fill="#94A3B8" font-size="18">12306 MCP</text><circle cx="1124" cy="214" r="9" fill="#F43F5E"/>

    <rect x="758" y="262" width="400" height="72" rx="6" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="782" y="293" fill="#F8FAFC" font-size="25" font-weight="700">$plan-china-transfers</text><text x="782" y="319" fill="#94A3B8" font-size="18">AMAP LBS</text><circle cx="1124" cy="298" r="9" fill="#F43F5E"/>

    <rect x="758" y="346" width="400" height="72" rx="6" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="782" y="377" fill="#F8FAFC" font-size="25" font-weight="700">$search-china-hotels</text><text x="782" y="403" fill="#94A3B8" font-size="18">FLYAI · FLIGGY</text><circle cx="1124" cy="382" r="9" fill="#F43F5E"/>

    <rect x="758" y="430" width="400" height="72" rx="6" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="782" y="461" fill="#F8FAFC" font-size="25" font-weight="700">$verify-travel-web</text><text x="782" y="487" fill="#94A3B8" font-size="18">EGO BROWSER · ON DEMAND</text><circle cx="1124" cy="466" r="9" fill="#F43F5E"/>

    <rect x="758" y="514" width="400" height="72" rx="6" fill="#111827" stroke="#38BDF8" stroke-width="2"/>
    <text x="782" y="545" fill="#F8FAFC" font-size="25" font-weight="700">$explore-china-routes</text><text x="782" y="571" fill="#94A3B8" font-size="18">OMNIROUTE · STANDARD / PRO / MAX</text><circle cx="1124" cy="550" r="9" fill="#38BDF8"/>

    <rect x="758" y="598" width="400" height="72" rx="6" fill="#111827" stroke="#38BDF8" stroke-width="2"/>
    <text x="782" y="629" fill="#F8FAFC" font-size="25" font-weight="700">$present-china-trip</text><text x="782" y="655" fill="#94A3B8" font-size="18">VISUALIZE · HTML · SVG</text><circle cx="1124" cy="634" r="9" fill="#38BDF8"/>
  </g>
  <text x="42" y="718" fill="#94A3B8" font-size="22" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PROVIDER QUERY ───  DETERMINISTIC COMPOSE / PRESENT - - -</text>
</svg>
