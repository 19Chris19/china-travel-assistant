<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">本地凭据安全边界</title>
  <desc id="desc">真实 Key 只保存在权限为 0600 的本地文件中，对话、MCP URL、Issue、日志和 Git 提交均不得包含 Key。</desc>
  <rect width="1200" height="600" rx="8" fill="#0B0F17"/>
  <text x="42" y="54" fill="#F8FAFC" font-size="36" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">真实 Key 留在本机，公开表面保持为空</text>
  <text x="42" y="88" fill="#94A3B8" font-size="24" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LOCAL SECRET STORE → PROVIDER-SCOPED READ → NO EXFILTRATION</text>

  <rect x="40" y="126" width="478" height="390" rx="8" fill="#111827" stroke="#FBBF24" stroke-width="3"/>
  <rect x="66" y="152" width="236" height="38" rx="4" fill="#3A2B08" stroke="#FBBF24"/>
  <text x="184" y="178" text-anchor="middle" fill="#FBBF24" font-size="21" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PROTECTED LOCAL ZONE</text>
  <path d="M408 170v-18c0-30 44-30 44 0v18" fill="none" stroke="#FBBF24" stroke-width="8"/>
  <rect x="400" y="168" width="60" height="52" rx="7" fill="#FBBF24"/>
  <circle cx="430" cy="191" r="8" fill="#1A1202"/><rect x="426" y="191" width="8" height="17" fill="#1A1202"/>
  <text x="70" y="248" fill="#F8FAFC" font-size="28" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">credentials.env</text>
  <text x="70" y="282" fill="#94A3B8" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~/.config/china-travel-assistant/</text>
  <rect x="70" y="310" width="118" height="46" rx="5" fill="#3A2B08" stroke="#FBBF24"/>
  <text x="129" y="341" text-anchor="middle" fill="#FBBF24" font-size="25" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">MODE 0600</text>
  <text x="70" y="402" fill="#CBD5E1" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">AMAP_* · FLYAI_* · VARIFLIGHT_*</text>
  <text x="70" y="444" fill="#34D399" font-size="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">环境变量可覆盖 · doctor 不回显</text>
  <text x="70" y="480" fill="#64748B" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">READ ONLY BY THE REQUIRED PROVIDER</text>

  <rect x="558" y="118" width="84" height="406" rx="6" fill="#261E0B" stroke="#FBBF24" stroke-width="2"/>
  <path d="M572 154h56M572 194h56M572 234h56M572 274h56M572 314h56M572 354h56M572 394h56M572 434h56M572 474h56" stroke="#FBBF24" stroke-width="4"/>
  <text x="600" y="550" text-anchor="middle" fill="#FBBF24" font-size="20" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">BOUNDARY</text>

  <rect x="682" y="126" width="478" height="390" rx="8" fill="#111827" stroke="#334155" stroke-width="2"/>
  <rect x="708" y="152" width="200" height="38" rx="4" fill="#1F2937"/>
  <text x="808" y="178" text-anchor="middle" fill="#CBD5E1" font-size="21" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PUBLIC / EXECUTION ZONE</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="708" y="224" width="196" height="72" rx="5" fill="#0F172A" stroke="#334155"/>
    <text x="728" y="254" fill="#F8FAFC" font-size="24" font-weight="700">CODEX CHAT</text><text x="728" y="282" fill="#34D399" font-size="20">NO_KEYS_PRESENT</text>
    <rect x="932" y="224" width="196" height="72" rx="5" fill="#0F172A" stroke="#334155"/>
    <text x="952" y="254" fill="#F8FAFC" font-size="24" font-weight="700">MCP URL</text><text x="952" y="282" fill="#34D399" font-size="20">NO_KEYS_PRESENT</text>
    <rect x="708" y="320" width="196" height="72" rx="5" fill="#0F172A" stroke="#334155"/>
    <text x="728" y="350" fill="#F8FAFC" font-size="24" font-weight="700">ISSUE / LOG</text><text x="728" y="378" fill="#34D399" font-size="20">NO_KEYS_PRESENT</text>
    <rect x="932" y="320" width="196" height="72" rx="5" fill="#0F172A" stroke="#334155"/>
    <text x="952" y="350" fill="#F8FAFC" font-size="24" font-weight="700">GIT COMMIT</text><text x="952" y="378" fill="#34D399" font-size="20">NO_KEYS_PRESENT</text>
  </g>
  <text x="708" y="450" fill="#F43F5E" font-size="23" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">禁止回显 · 禁止入对话 · 禁止提交</text>
  <text x="708" y="486" fill="#94A3B8" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">GITLEAKS + SANITIZED ERRORS</text>
</svg>
